[package]
name = "source-vtf"
description = "Fast, safe and ergonomic support for Valve Texture Format files."
readme = "README.md"
keywords = ["source-engine", "vtf", "texture", "gamedev"]
categories = ["game-development", "multimedia::images"]
repository = "https://github.com/LaVashikk/SourceRS/tree/main/crates/source-vtf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bitflags.workspace = true
num_enum.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
serde = ["dep:serde", "bitflags/serde"]
